<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Crea, juega y comparte roscos educativos de cualquier materia."><title>Rosco LAB · Tecnología Insti</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='24' fill='none' stroke='%234f46e5' stroke-width='10' stroke-dasharray='5 5'/%3E%3Ctext x='32' y='41' font-size='27' text-anchor='middle' font-family='Arial' font-weight='bold' fill='%234f46e5'%3ER%3C/text%3E%3C/svg%3E"><style id="app-style">:root{color-scheme:light;--bg:#f4f6fb;--panel:#fff;--ink:#18253d;--muted:#5e6c85;--line:#dce3ef;--accent:#4f46e5;--accent2:#078d9d;--soft:#edf0ff;--good:#138449;--bad:#be3448;--shadow:0 10px 34px #24385b0c}*{box-sizing:border-box}body{margin:0;font:16px/1.5 system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--ink)}body.dark{color-scheme:dark;--bg:#0e1728;--panel:#172338;--ink:#f0f4ff;--muted:#b0bed6;--line:#35435c;--soft:#243353;--shadow:none}button,input,select,textarea{font:inherit}button,a.btn{cursor:pointer;border:1px solid var(--line);border-radius:10px;padding:10px 15px;background:var(--panel);color:var(--ink);font-weight:650;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:7px;transition:background .15s,transform .15s}button:hover,a.btn:hover{background:var(--soft)}button:active{transform:translateY(1px)}button:disabled{opacity:.45;cursor:not-allowed}button.primary,a.primary{background:var(--accent);color:white;border-color:transparent}button.primary:hover{filter:brightness(.94)}button.danger{color:var(--bad)}button.good{background:#147c45;color:#fff;border-color:transparent}button.bad{background:#b92e46;color:#fff;border-color:transparent}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #0ba5bb;outline-offset:2px}header{background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:9}.top{max-width:1320px;margin:auto;padding:12px 24px;display:flex;align-items:center;gap:16px}.brand{display:flex;gap:11px;align-items:center;margin-right:auto;cursor:pointer}.brand strong{font-size:22px;letter-spacing:-.6px;line-height:1}.brand small{display:block;color:var(--muted);font-size:11px;letter-spacing:.8px}.brandmark{width:44px;height:44px}nav{display:flex;gap:5px;flex-wrap:wrap}nav button{border:0;background:transparent;padding:8px 11px}nav button.active{background:var(--soft);color:var(--accent)}.logo{width:40px;height:40px;object-fit:contain;border-radius:10px}.main{max-width:1320px;margin:auto;padding:26px 24px 48px;min-height:80vh}.hero{background:linear-gradient(120deg,#11203d,#343078 65%,#12667d);color:white;display:grid;grid-template-columns:1.4fr .8fr;align-items:center;padding:32px 42px;border-radius:24px;overflow:hidden;gap:20px}.hero h1{font-size:clamp(34px,4vw,64px);line-height:1.02;margin:12px 0 15px;letter-spacing:-2px}.hero p{color:#e1e9ff;max-width:590px;font-size:18px}.eyebrow{font-weight:750;letter-spacing:1.8px;font-size:11px;text-transform:uppercase}.hero .eyebrow{color:#a5e5ec}.hero .primary{background:#fff;color:#283776}.hero .secondary{background:#ffffff12;color:white;border-color:#ffffff55}.hero svg{width:100%;max-height:255px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}.section-title{display:flex;align-items:end;justify-content:space-between;gap:12px;margin:30px 0 14px}.section-title h2,h2,h3{margin:0;line-height:1.2}.section-title p,p{margin:7px 0 12px}.muted,small{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:15px}.tile,.panel{background:var(--panel);border:1px solid var(--line);border-radius:17px;padding:20px;box-shadow:var(--shadow)}.tile{display:flex;flex-direction:column;gap:8px;position:relative;overflow:hidden}.tile .row:last-child{margin-top:auto}.tile h3{font-size:19px}.tile p{font-size:14px;color:var(--muted)}.symbol{display:grid;place-items:center;width:48px;height:48px;font-size:24px;background:var(--soft);border-radius:13px}.tile[data-color]{border-top:4px solid var(--tile-color)}.pill{font-size:12px;font-weight:700;color:var(--muted);background:var(--soft);padding:4px 9px;border-radius:20px;display:inline-block}.pagehead{margin-bottom:18px}.pagehead h1{font-size:32px;letter-spacing:-1px;margin:4px 0}.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px}.field{display:flex;flex-direction:column;gap:5px;min-width:0}.field>span,label.label{font-size:13px;font-weight:700;color:var(--muted)}input:not([type=checkbox]),select,textarea{border:1px solid var(--line);border-radius:9px;padding:10px 12px;background:var(--panel);color:var(--ink);width:100%;min-width:0}textarea{resize:vertical}input[type=checkbox]{accent-color:var(--accent);width:17px;height:17px} .letterpick{display:flex;flex-wrap:wrap;gap:5px}.letterpick label{display:grid;place-items:center;width:36px;height:38px;border:1px solid var(--line);border-radius:8px;cursor:pointer;font-weight:700;position:relative}.letterpick label:has(input:checked){background:var(--accent);color:white;border-color:transparent}.letterpick input{position:absolute;opacity:0}.letterpick label:focus-within{outline:3px solid #0ba5bb}.stack{display:grid;gap:15px}.split{display:grid;grid-template-columns:1fr 1fr;gap:16px}.notice{padding:12px 15px;border:1px solid var(--line);background:var(--soft);border-radius:10px;font-size:14px}.error{color:var(--bad)}.success{color:var(--good)}.dark .success{color:#77e9a8}.dark .error{color:#ff9da9}.scroll{overflow:auto}table{width:100%;border-collapse:collapse;text-align:left}th,td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top}th{font-size:12px;color:var(--muted)}td input,td select,td textarea{font-size:14px;padding:8px!important}td textarea{min-height:62px}td:first-child{font-weight:800;text-align:center}td.invalid{border-left:3px solid var(--bad)}.toolbar{position:sticky;bottom:12px;background:var(--panel);border:1px solid var(--line);padding:12px;border-radius:13px;box-shadow:0 8px 30px #16264125;z-index:4}.game-layout{display:grid;grid-template-columns:minmax(300px,1fr) minmax(320px,1.1fr);gap:18px;align-items:start}.wheel{width:min(100%,550px);aspect-ratio:1;position:relative;margin:auto}.wheel-letter{position:absolute;transform:translate(-50%,-50%);width:10%;height:10%;border-radius:50%;padding:0;background:var(--accent);color:white;border:2px solid var(--panel);font-size:clamp(13px,2vw,24px);box-shadow:0 2px 7px #0002}.wheel-letter:active{transform:translate(-50%,-50%)}.wheel-letter.correct{background:#16834a}.wheel-letter.wrong{background:#c43848}.wheel-letter.current{background:#f3bf35;color:#1f2838;outline:3px solid #eeb326;outline-offset:2px}.wheel-letter:disabled{opacity:1;cursor:default}.wheel-center{position:absolute;inset:25%;display:grid;align-content:center;justify-items:center;text-align:center;pointer-events:none}.clock{font-variant-numeric:tabular-nums;font-size:clamp(28px,5vw,58px);font-weight:800;letter-spacing:-2px;line-height:1}.question{font-size:clamp(22px,3vw,38px);font-weight:700;line-height:1.22;margin:15px 0 20px}.letter-big{font-size:38px;font-weight:900;color:var(--accent)}.scores{display:flex;gap:12px;flex-wrap:wrap}.scores>div{flex:1;min-width:130px;border:1px solid var(--line);border-radius:12px;padding:10px}.scores .active-team{border:2px solid var(--accent)}.feedback{min-height:30px;font-weight:650;margin:8px 0}.pdi .question{font-size:clamp(28px,4vw,52px)}.pdi header{position:static}.pdi .main{max-width:1550px}.pdi .wheel{max-width:620px}footer{border-top:1px solid var(--line);padding:18px 24px;text-align:center;color:var(--muted);font-size:13px}footer a{color:var(--muted)}.hidden{display:none!important}#toast{position:fixed;bottom:25px;right:25px;background:#17243d;color:white;padding:14px 18px;border-radius:12px;z-index:20;max-width:90vw;box-shadow:0 5px 25px #0003}a{color:var(--accent)}@media(max-width:800px){.top{flex-wrap:wrap;padding:10px 14px;gap:7px}nav{order:3;width:100%;overflow:auto;flex-wrap:nowrap}nav button{white-space:nowrap;font-size:13px}.main{padding:18px 12px}.hero{padding:24px;grid-template-columns:1fr}.hero svg{max-height:180px}.split,.game-layout{grid-template-columns:1fr}.section-title{align-items:start}.tile,.panel{padding:15px}.wheel{max-width:420px}.pagehead h1{font-size:27px}}@media print{header,footer,button,.no-print,#toast{display:none!important}.main{padding:0}.panel{border:0;box-shadow:none}body{background:white;color:black}table{font-size:11px}}

", "N", "Ñ", "O", "P", "Q", "R", "S", "T", "U", "V", "W", "X", "Y", "Z"], "levels": [{"name": "Básico", "banks": [{"name": "Banco A", "questions": [{"letter": "A", "mode": "starts", "clue": "Provincia andaluza donde se encuentra el desierto de Tabernas.", "answer": "Almería", "fact": "El desierto de Tabernas, en Almería, ha servido de escenario para numerosas películas.", "aliases": []}, {"letter": "B", "mode": "starts", "clue": "¿Qué pensador andaluz es conocido como «Padre de la Patria Andaluza»? Escribe su nombre y apellido.", "answer": "Blas Infante", "fact": "Blas Infante impulsó los símbolos andaluces, como la bandera verdiblanca y la letra del himno.", "aliases": []}, {"letter": "C", "mode": "starts", "clue": "Provincia andaluza en la que se encuentra Jerez de la Frontera.", "answer": "Cádiz", "fact": "Cádiz es una de las ocho provincias de Andalucía y tiene costas atlánticas.", "aliases": []}, {"letter": "D", "mode": "starts", "clue": "Mes del año en el que se celebra el Día de la Bandera de Andalucía.", "answer": "Diciembre", "fact": "Se celebra el 4 de diciembre, en memoria de las manifestaciones por la autonomía de 1977.", "aliases": []}, {"letter": "E", "mode": "starts", "clue": "Forma tradicional malagueña de preparar sardinas ensartadas en una caña y asadas a la brasa.", "answer": "Espeto", "fact": "Los espetos de sardinas son característicos del litoral de Málaga.", "aliases": []}, {"letter": "F", "mode": "starts", "clue": "Arte andaluz que combina cante, baile y toque de guitarra.", "answer": "Flamenco", "fact": "El flamenco es Patrimonio Cultural Inmaterial de la Humanidad reconocido por la UNESCO.", "aliases": []}, {"letter": "G", "mode": "starts", "clue": "Provincia andaluza en la que se encuentra la Alhambra.", "answer": "Granada", "fact": "La Alhambra es uno de los conjuntos monumentales más conocidos de Andalucía.", "aliases": []}, {"letter": "H", "mode": "starts", "clue": "Provincia andaluza en la que se encuentra el Parque Nacional de Doñana, function newRosco(letters=ABC,levels=1,banks=1){return {schema:'roscolab.v1',id:uid(),title:'Mi nuevo rosco',subject:'Otra',course:'3º ESO',author:'',description:'',color:'#4f46e5',letters:[...letters],levels:Array.from({length:levels},(_,i)=>({name:['Básico','Intermedio','Avanzado','Experto'][i],banks:Array.from({length:banks},(_,j)=>({name:`Banco ${String.fromCharCode(65+j)}`,questions:letters.map(qblank)}))}))}}

function normalize(raw){if(raw&&raw.rosco)raw=raw.rosco;if(raw&&raw['1']?.green){const old=raw;raw={title:'Rosco importado',subject:'Otra',course:'Todos los niveles',letters:ABC,levels:Object.keys(old).filter(k=>/^\d+$/.test(k)).map(k=>({name:`Nivel ${k}`,banks:[{name:'Banco A',questions:old[k].green},{name:'Banco B',questions:old[k].white}]}))}}if(!raw||!Array.isArray(raw.letters)||!Array.isArray(raw.levels))throw Error('El JSON no contiene letters y levels. Utiliza el formato Rosco LAB.');const letters=raw.letters.map(l=>String(l).toUpperCase());if(letters.length<2||letters.length>27||new Set(letters).size!==letters.length||letters.some(l=>!ABC.includes(l)))throw Error('Selecciona de 2 a 27 letras españolas diferentes.');if(raw.levels.length<1||raw.levels.length>4)throw Error('Se admiten de 1 a 4 niveles.');let r={schema:'roscolab.v1',id:uid(),title:String(raw.title||'Rosco importado').slice(0,120),subject:String(raw.subject||'Otra').slice(0,80),course:String(raw.course||'Todos los niveles').slice(0,80),author:String(raw.author||'').slice(0,100),description:String(raw.description||'').slice(0,1000),color:/^#[0-9a-f]{6}$/i.test(raw.color)?raw.color:colors[raw.subject]||'#4f46e5',letters,levels:[]};r.levels=raw.levels.map((l,i)=>{if(!Array.isArray(l.banks)||l.banks.length<1||l.banks.length>4)throw Error(`Nivel ${i+1}: se admiten 1–4 bancos.`);return {name:String(l.name||`Nivel ${i+1}`).slice(0,80),banks:l.banks.map((b,j)=>{if(!Array.isArray(b.questions))throw Error('Falta questions en un banco.');let qs=b.questions;if(qs.length!==letters.length||new Set(qs.map(q=>String(q.letter).toUpperCase())).size!==letters.length||qs.some(q=>!letters.includes(String(q.letter).toUpperCase())))throw Error(`Nivel ${i+1}, banco ${j+1}: debe haber exactamente una pregunta por letra.`);return {name:String(b.name||`Banco ${j+1}`).slice(0,80),questions:letters.map(letter=>{let q=qs.find(q=>String(q.letter).toUpperCase()===letter);if(!['starts','contains'].includes(q.mode))throw Error(`L function wheelArt(){return `<svg viewBox="0 0 320 280" role="img" aria-label="Rosco multicolor de letras"><circle cx="160" cy="140" r="112" fill="none" stroke="#ffffff20" stroke-width="2"/><circle cx="160" cy="140" r="88" fill="#ffffff09"/>${ABC.map((l,i)=>{let a=i*2*Math.PI/ABC.length-Math.PI/2,x=160+112*Math.cos(a),y=140+112*Math.sin(a);return `<circle cx="${x}" cy="${y}" r="11" fill="${['#65d8e7','#929bff','#b2f0c9','#f9d285'][i%4]}"/><text x="${x}" y="${y+4}" text-anchor="middle" font-size="12" font-weight="800" fill="#15213a">${l}</text>`}).join('')}<text x="160" y="135" text-anchor="middle" fill="white" font-size="28" font-weight="800">¡A JUGAR!</text><text x="160" y="158" text-anchor="middle" fill="#c1d7f6" font-size="12">TODAS LAS MATERIAS</text></svg>`}

function bindCards(){app.querySelectorAll('[data-play]').forEach(b=>b.onclick=()=>setup(byId(b.dataset.play)));app.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{let r=byId(b.dataset.edit);draft=clone(r);if(!mine.some(x=>x.id===r.id)){draft.id=uid();draft.title+=' · copia'}editLevel=editBank=0;dirty=false;go('editor',true)});app.querySelectorAll('[data-export]').forEach(b=>b.onclick=()=>exportJSON(byId(b.dataset.export)));app.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>{if(confirm('¿Eliminar este rosco guardado?')){mine=mine.filter(r=>r.id!==b.dataset.delete);if(!persist())toast('No se pudo actualizar el almacenamiento.');list(true)}})}
function home(){app.innerHTML=`<section class="hero"><div><div class="eyebrow">Tu aula · tus preguntas · tu juego</div><h1>Crea. Juega.<br>Aprende.</h1><p>Convierte cualquier contenido en un rosco interactivo. Diseña tus preguntas, adapta juegos y prepara retos para tu clase.</p><div class="row"><button class="primary" id="heroPlay">Explorar roscos →</button><button class="secondary" id="heroCreate">Crear mi rosco</button><button class="secondary" id="heroPDF">Crear desde PDF</button></div></div>${wheelArt()}</section><div class="section-title"><div><h2>¿Qué quieres hacer hoy?</h2><p class="muted">Herramientas pensadas para el profesorado.</p></div></div><div class="grid">${[['◉','Jugar a un rosco','Descubre los juegos listos para usar.','library'],['✎','Crear manualmente','Personaliza letras, preguntas y niveles.','editor'],['✦','Crear con IA','Sube un PDF y genera preguntas o utiliza un prompt.','ai'],['▤','Mis roscos','Guarda, edita y exporta tus creaciones.','mine']].map(([s,t,d,n])=>`<article class="tile"><div class="symbol">${s}</div><h3>${t}</h3><p>${d}</p><button data-home="${n}">Abrir →</button></article>`).join('')}</div><div class="section-title"><div><h2>Roscos destacados</h2><p class="muted">Una biblioteca para todas las materias.</p></div><button id="all">Ver todos</button></div><div class="grid">${library.slice(0,4).map(r=>card(r)).join('')}</div>`;act('heroPlay',()=>go('library'));act('heroPDF',()=>go('ai'));act('heroCreate',()=>create());act('all',()=>go('library'));app.querySelectorAll('[data-home]').forEach(b=>b.onclick=()=>b.dataset.home==='editor'?create():go(b.dataset.home));bindCards()}

function syncEditor(){if(!$('edTitle'))return;draft.title=val('edTitle').trim()||'Mi nuevo rosco';draft.subject=val('edSubject');draft.course=val('edCourse');draft.author=val('edAuthor');draft.description=val('edDescription');draft.color=val('edColor');let lv=draft.levels[editLevel],bank=lv.banks[editBank];lv.name=val('levelName')||`Nivel ${editLevel+1}`;bank.name=val('bankName')||`Banco ${editBank+1}`;app.querySelectorAll('tr[data-q]').forEach((tr,i)=>{let q=bank.questions[i];for(let k of ['clue','answer','mode','fact','source'])q[k]=tr.querySelector(`[data-field="${k}"]`).value;q.aliases=tr.querySelector('[data-field="aliases"]').value.split(';').map(x=>x.trim()).filter(Boolean)})}

lue="${i}" ${i===editBank?'selected':''}>${i+1}. ${esc(l.name)}</option>`).join('')}</select></label>${field('Nombre del banco','bankName',b.name)}</div><div class="scroll"><table style="min-width:950px"><thead><tr><th>Letra</th><th>Tipo</th><th style="width:28%">Pregunta</th><th style="width:17%">Respuesta</th><th>Alternativas (;)</th><th>Explicación</th><th>Fuente / pág.</th></tr></thead><tbody>${b.questions.map(q=>`<tr data-q="${q.letter}"><td>${q.letter}</td><td><select data-field="mode" aria-label="Tipo ${q.letter}"><option value="starts" ${q.mode==='starts'?'selected':''}>Empieza por</option><option value="contains" ${q.mode==='contains'?'selected':''}>Contiene</option></select></td><td><textarea data-field="clue" aria-label="Pregunta ${q.letter}">${esc(q.clue)}</textarea></td><td><input data-field="answer" aria-label="Respuesta ${q.letter}" value="${esc(q.answer)}"></td><td><input data-field="aliases" aria-label="Alternativas ${q.letter}" value="${esc(q.aliases.join('; '))}"></td><td><textarea data-field="fact" aria-label="Explicación ${q.letter}">${esc(q.fact)}</textarea></td><td><input data-field="source" aria-label="Fuente ${q.letter}" value="${esc(q.source||'')}"></td></tr>`).join('')}</tbody></table></div><div id="audit" class="notice" style="margin-top:12px">Verifica las respuestas antes de jugar.</div></section><div class="toolbar row"><button class="primary" id="save">Guardar rosco</button><button id="verify">Verificar preguntas</button><button id="playDraft">Jugar</button><button id="exportDraft">Exportar JSON</button><button id="exportHtml">Descargar HTML autónomo</button><button id="printDraft">Solucionario</button><button id="newDraft">Nuevo</button></div></div>`;bindLetters();app.oninput=()=>{if(view==='editor')dirty=true};$('edSubject').onchange=()=>{$('edColor').value=colors[val('edSubject')]||'#4f46e5';dirty=true};$('levelSelect').onchange=()=>{syncEditor();editLevel=Number(val('levelSelect'));editBank=0;renderEditor()};$('bankSelect').onchange=()=>{syncEditor();editBank=Number(val('bankSelect'));renderEditor()};act('applyLetters',()=>{syncEditor();let ls=picked();if(ls.length<2)return toast('Selecciona al menos dos letras.');if(r.letters.some(l=>!ls.includes(l))&&!confirm('Se eliminarán las preguntas de las letras desmarcadas. ¿Continuar?'))return;r.letters=ls;r.levels.forEach(l=>l.banks.forEach(b=>b.questions=ls.map(x=>b.questions.find(q=>q.letter===x)||qblank(x))));dirty=true;renderEditor()});act('addLevel',()=>{syncEditor();r.levels.push(newRosco(r.letters).levels[0]);editLevel=r.levels.length-1;r.levels[editLevel].name=`Nivel ${editLevel+1}`;editBank=0;dirty=true;renderEditor()});act('removeLevel',()=>{if(confirm('¿Eliminar el nivel y sus preguntas?')){syncEditor();r.levels.splice(editLevel,1);editLevel=editBank=0;dirty=true;renderEditor()}});act('addBank',()=>{syncEditor();lv.banks.push({name:`Banco ${String.fromCharCode(65+lv.banks.length)}`,questions:r.letters.map(qblank)});editBank=lv.banks.length-1;dirty=true;renderEditor()});act('removeBank',()=>{if(confirm('¿Eliminar el banco y sus preguntas?')){syncEditor();lv.banks.splice(editBank,1);editBank=0;dirty=true;renderEditor()}});act('verify',audit);act('save',()=>{syncEditor();let i=mine.findIndex(x=>x.id===r.id);if(i<0)mine.push(clone(r));else mine[i]=clone(r);dirty=false;toast(persist()?'Rosco guardado en este navegador.':'No se pudo guardar en el navegador. Exporta JSON para conservarlo.');audit()});act('playDraft',()=>{syncEditor();if(issues(r).some(x=>x.hard))return audit();setup(clone(r))});act('exportDraft',()=>{syncEditor();exportJSON(r)});act('exportHtml',()=>{syncEditor();if(issues(r).some(x=>x.hard))return audit();exportHTML(r)});act('printDraft',()=>{syncEditor();printAnswers(r)});act('newDraft',create)}
function audit(){syncEditor();let errs=issues(draft),hard=errs.filter(x=>x.hard).length;$('audit').innerHTML=errs.length?`<strong class="${hard?'error':'success'}">${hard} errores · ${errs.length-hard} avisos</strong><details open><summary>Ver incidencias</summary>${errs.slice(0,300).map(x=>`<div>${esc(x.label)}: ${esc(x.msg)}</div>`).join('')}</details>`:'<strong class="success">✓ Todas las preguntas cumplen las comprobaciones básicas.</strong>';return hard===0}

n><label id="pageBox" class="field hidden"><span>Páginas (ej. 1-3, 5; vacío = todas)</span><input id="pageRange" placeholder="Todas las páginas"></label><p id="docStatus" role="status" class="muted"></p><details id="docPreview" class="hidden"><summary>Ver texto extraído</summary><textarea id="extractedPreview" rows="6" readonly></textarea></details></div><label class="field"><span>Método de generación</span><select id="generationMethod"><option value="auto">Automático (IA local si está disponible; si no, solo definiciones)</option><option value="rules">Extracción de definiciones · sin IA</option><option value="local">IA local de Chrome · experimental</option></select></label><div class="row"><button id="checkLocal">Comprobar IA local</button><span id="localStatus" class="muted" role="status">Sin comprobar</span></div><div class="notice" id="directCost">Solo pistas de definición o preguntas completas. No se generan frases con huecos. Si faltan conceptos fiables, quedarán letras pendientes. El método usado aparece en el resultado.</div><div class="row"><button class="primary" id="directGenerate">✦ Generar borrador</button><button id="directCancel" class="hidden">Cancelar</button><button id="directPartial" class="hidden">Revisar borrador</button></div><progress id="directProgress" class="hidden" value="0" max="1"></progress><p id="directStatus" role="status" aria-live="polite" class="muted"></p><div id="candidateBox" class="hidden stack"><div id="candidateSummary" class="notice"></div><div class="row"><button id="alternativeDraft">Probar otras preguntas</button><button id="trimDraft">Usar solo letras completas</button></div><details><summary>Ver conceptos detectados</summary><div id="candidateList" class="muted"></div></details></div><small>El PDF se lee en tu navegador. Los documentos escaneados sin texto no son compatibles con esta versión. Revisa siempre el resultado y las páginas indicadas.</small></div><div class="stack hidden" id="promptPanel"><h3>Asistente con tu IA habitual</h3><div class="notice" id="aiInstructions"></div><textarea id="prompt" rows="15" readonly aria-label="Prompt generado"></textarea><div class="row"><button class="primary" id="copyPrompt">Copiar prompt</button><a class="btn" href="https://chatgpt.com/" target="_blank" rel="noopener">ChatGPT ↗</a><a class="btn" href="https://gemini.google.com/" target="_blank" rel="noopener">Gemini ↗</a></div><a class="btn" href="https://claude.ai/" target="_blank" rel="noopener">Claude ↗</a><small>No adjuntes datos personales del alumnado. Revisa las respuestas antes de jugar.</small></div></section></div><section class="panel" style="margin-top:16px"><h2>3. Importa el resultado</h2><p class="muted">Pega el JSON generado por la IA o abre su archivo. Pasarás al editor para revisar y guardar.</p><textarea id="importText" rows="6" placeholder="Pega aquí el JSON…"></textarea><div class="row" style="margin-top:10px"><button class="primary" id="importPaste">Importar y revisar</button><button id="importFile">Abrir archivo JSON</button><input type="file" id="aiFile" accept=".json,application/json" hidden></div><p id="importError" class="error" role="alert"></p></section>`;bindLetters();app.oninput=()=>{if(view==='ai')updatePrompt()};app.onchange=()=>{if(view==='ai')updatePrompt()};act('copyPrompt',async()=>{try{await navigator.clipboard.writeText(val('prompt'));toast('Prompt copiado.')}catch{$('prompt').focus();$('prompt').select();toast('Seleccionado: pulsa Ctrl+C para copiar.')}});act('importPaste',()=>{try{importText(val('importText'))}catch(e){$('importError').textContent=e.message}});act('importFile',()=>$('aiFile').click());$('aiFile').onchange=async()=>{try{importText(await $('aiFile').files[0].text())}catch(e){$('importError').textContent=e.message}};bindDirect();updatePrompt()}
function updatePrompt(){let ls=picked(),n=Number(val('aiLevels')),b=Number(val('aiBanks')),src=val('sourceType'),r=newRosco(ls,n,b);r.title=val('aiTitle')||'Mi rosco educativo';r.subject=val('aiSubject');r.course=val('aiCourse');r.color=colors[r.subject]||'#4f46e5';let sample={schema:r.schema,title:r.title,subject:r.subject,course:r.course,author:'',description:'Descripción breve',color:r.color,letters:ls,levels:[{name:'Básico',banks:[{name:'Banco A',questions:[{letter:ls[0]||'A',mode:'starts',clue:'Pregunta de ejemplo',answer:'Respuesta que cumple la letra',fact:'Explicación breve',aliases:[],source:'Página si se conoce'}]}]}]};$('aiCount').textContent=`${ls.length} letras × ${n} niveles × ${b} bancos = ${ls.length*n*b} preguntas. ${ls.length<2?'Selecciona al menos 2 letras.':''}`;$('copyPrompt').disabled=ls.length<2;$('aiInstructions').textContent=['PDF','Word'].includes(src)?'Abre ChatGPT, Gemini o Claude, adjunta allí el documento y pega el prompt.':src==='Texto'?'Pega tus apuntes en el campo de texto y después copia el prompt a tu IA.':'Copia el prompt en tu IA para crear preguntas sobre el tema elegido.';$('prompt').value=`Actúa como docente especialista. Genera un rosco educativo compatible con Rosco LAB.\nMateria: ${r.subject}\nCurso: ${r.course}\nTítulo: ${r.title}\nDificultad: ${val('aiDifficulty')}\nOrigen: ${src}\n${val('aiText')?'Contenido/indicaciones:\n'+val('aiText')+'\n':''}${['PDF','Word'].includes(src)?'Lee el documento adjunto a esta conversación.\n':''}${src!=='Tema'&&$('aiStrict').checked?'Usa exclusivamente la información del material aportado. Si no puedes construir todas las letras, pide ajustar la selección antes de emitir JSON; no inventes hechos.\n':''}Crea exactamente ${n} niveles y ${b} bancos diferentes por nivel. En cada banco incluye exactamente una pregunta por cada letra de ${ls.join(', ')} en ese orden. Total: ${ls.length*n*b}. No repitas respuestas en un banco ni entre bancos del mismo nivel. Prioridad obligatoria: busca primero
